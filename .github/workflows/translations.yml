name: Weblate translations

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Code checks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: weblate-translations
  cancel-in-progress: false

jobs:
  translations:
    if: github.repository == 'mryx007/FrankyRenderer-Nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Always use trusted default-branch code, never workflow_run.head_sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install polib==1.2.0
      - name: Validate Weblate changes, approve CI and merge successful PRs
        run: python .github/scripts/weblate_prs.py
