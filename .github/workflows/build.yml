name: Build and test both packages

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      build_id:
        type: string
        default: ''
      candidate:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download prepared stable candidate
        if: inputs.candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-candidate
          path: promotion
      - name: Use the exact prepared source commit
        if: inputs.candidate
        run: |
          git fetch promotion/candidate.bundle HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $plan = Get-Content promotion/promotion.json | ConvertFrom-Json
          if ((git rev-parse HEAD) -ne $plan.commit) { throw 'Candidate source mismatch' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build helpers
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check code formatting before building
        run: python src/Tools/format_code.py --check
      - name: Cache verified dependency downloads and libplacebo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/deps/packages
            src/build/libplacebo-runtime
          key: windows-libplacebo-${{ hashFiles('src/deps/*lock.json', 'src/Tools/build_libplacebo.py', 'src/Tools/fetch_dependencies.py') }}
      - name: Restore verified dependencies
        run: |
          python src/Tools/fetch_dependencies.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python src/Tools/prepare_sdk.py
      - name: Prepare pinned FFmpeg inputs
        shell: cmd
        run: |
          call src\Tools\vsenv.cmd
          if errorlevel 1 exit /b 1
          python .github\scripts\prepare_dv.py
      - name: Build native MPC-BE package
        shell: cmd
        run: build.cmd native
      - name: Build PotPlayer package
        shell: cmd
        run: build.cmd potplayer
      - name: Run non-GPU regression checks
        shell: cmd
        run: |
          call src\Tests\build_motion_timing_tests.cmd
          if errorlevel 1 exit /b 1
          src\build\bin\test_motion_timing.exe
          if errorlevel 1 exit /b 1
          call src\Tests\build_presentation_timing_tests.cmd
          if errorlevel 1 exit /b 1
          call src\Tests\build_settings_ini_tests.cmd
          if errorlevel 1 exit /b 1
          call src\Tests\build_settings_before_playback_tests.cmd
          if errorlevel 1 exit /b 1
          call src\Tests\build_dovi_mapping_tests.cmd
          if errorlevel 1 exit /b 1
          call src\Tests\build_dv_status_tests.cmd
          if errorlevel 1 exit /b 1
      - name: Package and verify ZIPs
        env:
          CHANNEL: ${{ inputs.channel }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          $arguments = @('src/Tools/package_variants.py', '--output', 'releases/ci', '--channel', $env:CHANNEL)
          if ($env:CHANNEL -eq 'nightly') { $arguments += @('--build-id', $env:BUILD_ID) }
          python @arguments
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            releases/ci/*.zip
            releases/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
