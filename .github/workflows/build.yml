name: Build and test both packages

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      build_id:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build helpers
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check code formatting before building
        run: python src/format_code.py --check
      - name: Cache verified dependency downloads and libplacebo build
        uses: actions/cache@v4
        with:
          path: |
            src/deps/packages
            src/build/libplacebo-runtime
          key: windows-libplacebo-${{ hashFiles('src/deps/*lock.json', 'src/build_libplacebo.py', 'src/fetch_dependencies.py') }}
      - name: Restore verified dependencies
        run: |
          python src/fetch_dependencies.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python src/prepare_sdk.py
      - name: Prepare pinned FFmpeg inputs
        shell: cmd
        run: |
          call src\vsenv.cmd
          if errorlevel 1 exit /b 1
          python .github\scripts\prepare_dv.py
      - name: Build native MPC-BE package
        shell: cmd
        run: build.cmd native
      - name: Build PotPlayer package
        shell: cmd
        run: build.cmd potplayer
      - name: Run non-GPU regression checks
        shell: cmd
        run: |
          call src\build_motion_timing_tests.cmd
          if errorlevel 1 exit /b 1
          src\build\bin\test_motion_timing.exe
          if errorlevel 1 exit /b 1
          call src\build_presentation_timing_tests.cmd
          if errorlevel 1 exit /b 1
          call src\build_settings_ini_tests.cmd
          if errorlevel 1 exit /b 1
          call src\build_dovi_mapping_tests.cmd
          if errorlevel 1 exit /b 1
          call src\build_dv_status_tests.cmd
          if errorlevel 1 exit /b 1
      - name: Package and verify ZIPs
        env:
          CHANNEL: ${{ inputs.channel }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          $arguments = @('src/package_variants.py', '--output', 'releases/ci', '--channel', $env:CHANNEL)
          if ($env:CHANNEL -eq 'nightly') { $arguments += @('--build-id', $env:BUILD_ID) }
          python @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            releases/ci/*.zip
            releases/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
