name: Code checks
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/**'
      - '*requirements*.txt'
      - '*.cmd'
      - '.clang-format'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install polib==1.2.0
      - run: python .github/scripts/translation_checks.py
      - run: python .github/scripts/test_weblate_prs.py
      - run: python .github/scripts/test_dependency_updates.py
  formatting:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python src/Tools/format_code.py --check
      - name: Validate workflow and issue-form YAML
        run: |
          python -m pip install PyYAML==6.0.3
          python -c "import pathlib,yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('.github').rglob('*.yml')]"
  build:
    # Nightly pushes are built once by the publishing workflow below.
    if: github.event_name != 'push' || github.repository == 'mryx007/FrankyRenderer'
    uses: ./.github/workflows/build.yml
