name: Code checks
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/**'
      - '*requirements*.txt'
      - '*.cmd'
      - '.clang-format'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python src/format_code.py --check
      - name: Validate workflow and issue-form YAML
        run: |
          python -m pip install PyYAML==6.0.3
          python -c "import pathlib,yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('.github').rglob('*.yml')]"
  build:
    # Nightly pushes are built once by the publishing workflow below.
    if: github.event_name != 'push' || github.repository == 'mryx007/FrankyRenderer'
    uses: ./.github/workflows/build.yml
