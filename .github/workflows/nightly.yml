name: Publish Nightly
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/**'
      - 'requirements.txt'
      - '*.cmd'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-publication
  cancel-in-progress: false

jobs:
  identify:
    if: github.repository == 'mryx007/FrankyRenderer-Nightly'
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.id.outputs.value }}
    steps:
      - id: id
        # Date and UTC time first: GitHub lists releases by tag name, so several
        # Nightlies on one day must still sort newest first.
        run: echo "value=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"
  build:
    needs: identify
    uses: ./.github/workflows/build.yml
    with:
      channel: nightly
      build_id: ${{ needs.identify.outputs.build_id }}
  publish:
    needs: [identify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: ${{ needs.identify.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - run: python .github/scripts/nightly_notes.py
      - name: Publish tested packages as a normal release
        shell: bash
        run: |
          set -euo pipefail
          tag="nightly-$BUILD_ID"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This Nightly is already published; keeping its packages and notes unchanged."
          else
            gh release create "$tag" packages/*.zip --target "$GITHUB_SHA" --title "Nightly $BUILD_ID" --notes-file nightly-notes.md --latest
          fi
