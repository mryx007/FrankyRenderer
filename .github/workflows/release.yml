name: Publish stable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next version already committed in source: 1.0.9 → 1.1 → 1.1.1'
        required: true
        type: string
      changelog:
        description: 'Short release notes (English)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'mryx007/FrankyRenderer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version sequence and matching source
        run: |
          PREVIOUS_VERSION=$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')
          export PREVIOUS_VERSION
          python .github/scripts/validate_release.py
      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "This release already exists. No files were replaced."
            exit 1
          fi
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Publish release
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "v$RELEASE_VERSION" packages/* --target "$GITHUB_SHA" --title "FrankyRenderer $RELEASE_VERSION" --notes-file release-notes.md --latest
