name: Publish stable release
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test without publishing (leave off for a release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stable-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'mryx007/FrankyRenderer' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor_id == '149878151' && github.triggering_actor == 'mryx007'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare Nightly, next version and its changelog
        run: python .github/scripts/prepare_stable.py
      - name: Verify generated versions
        run: |
          export RELEASE_VERSION=$(python -c "import json; print(json.load(open('promotion/promotion.json'))['version'])")
          python .github/scripts/validate_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-candidate
          path: promotion/
          if-no-files-found: error
          retention-days: 7
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      candidate: true
  publish:
    needs: build
    if: ${{ !inputs.test_only && github.actor_id == '149878151' && github.triggering_actor == 'mryx007' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-candidate
          path: promotion
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Publish tested source and packages
        shell: bash
        run: |
          set -euo pipefail
          git fetch promotion/candidate.bundle HEAD
          git checkout --detach FETCH_HEAD
          version=$(python -c "import json; print(json.load(open('promotion/promotion.json'))['version'])")
          expected=$(python -c "import json; print(json.load(open('promotion/promotion.json'))['commit'])")
          base=$(python -c "import json; print(json.load(open('promotion/promotion.json'))['base_commit'])")
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          git tag "v$version" "$expected"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
          gh release create "v$version" packages/* --verify-tag --title "FrankyRenderer $version" --notes-file promotion/release-notes.md --latest
