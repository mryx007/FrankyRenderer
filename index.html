<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Die FrankyRenderer-Anleitung auf Deutsch und Englisch mit integrierter Suche.">
  <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171b" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://raw.githubusercontent.com; img-src 'self' https:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>FrankyRenderer Wiki</title>
  <link rel="stylesheet" href="style.css?v=8">
  <script type="module" src="app.js?v=6"></script>
</head>
<body>
  <a id="skip" class="skip" href="#article">Zum Inhalt</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="menu" class="nav-toggle icon-button" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Kapitel öffnen">
        <span class="menu-icon" aria-hidden="true"></span>
      </button>
      <a class="brand" id="home-link" href="./" data-route>
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>FrankyRenderer <small>Wiki</small></span>
      </a>
      <div class="header-controls">
        <form id="search" role="search">
          <label class="sr-only" id="query-label" for="query">Wiki durchsuchen</label>
          <input id="query" type="search" autocomplete="off" placeholder="Wiki durchsuchen" required>
          <button id="submit-search" type="submit">Suchen</button>
        </form>
        <div class="language" id="language" aria-label="Sprache">
          <a id="lang-de" href="./" lang="de" aria-label="Deutsch" aria-current="true" data-route>DE</a>
          <a id="lang-en" href="?lang=en" lang="en" aria-label="English" data-route>EN</a>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="chapters" aria-label="Kapitel"></nav>
    </aside>
    <main id="content" aria-busy="true">
      <div id="breadcrumb" class="breadcrumb" hidden></div>
      <article id="article" tabindex="-1"><p class="loading">Wiki wird geladen …</p></article>
      <section id="search-view" class="search-view" aria-labelledby="search-heading" tabindex="-1" hidden>
        <div class="search-view-header">
          <h1 id="search-heading">Suchergebnisse</h1>
          <button id="return-to-chapter" class="secondary-button" type="button">Zurück zum Kapitel</button>
        </div>
        <p id="status" role="status"></p>
        <button id="retry" class="secondary-button" type="button" hidden>Erneut laden</button>
        <ul id="results" class="results" aria-labelledby="search-heading"></ul>
        <button id="more" class="secondary-button more" type="button" hidden>Mehr Treffer anzeigen</button>
      </section>
    </main>
    <aside id="section-panel" class="section-panel" hidden>
      <nav id="sections" aria-label="Auf dieser Seite"></nav>
    </aside>
  </div>

  <noscript><p class="no-script"><a href="https://github.com/mryx007/FrankyRenderer/wiki/DE-Home">Zum GitHub-Wiki</a> · <a href="https://github.com/mryx007/FrankyRenderer/wiki">Open the GitHub wiki</a></p></noscript>
</body>
</html>
